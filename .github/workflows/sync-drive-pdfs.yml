name: Sync Google Drive documents as PDFs

on:
  workflow_dispatch:
  schedule:
    # Drive does not emit GitHub Actions events. Check for changes daily at noon UTC.
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: sync-drive-pdfs
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install export dependencies
        run: python -m pip install --upgrade google-api-python-client google-auth Pillow

      - name: Install document conversion tools
        run: sudo apt-get update && sudo apt-get install --yes libreoffice-writer poppler-utils

      - name: Export Drive documents as PDFs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: 13cYAubJBTUmxaBG4ED8RuQMQvNW9cBHF
        run: python scripts/export_drive_pdfs.py

      - name: Commit and push changed PDFs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/commit_drive_pdfs.mjs
