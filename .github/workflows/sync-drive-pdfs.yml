name: Sync Google Drive documents as PDFs

on:
  workflow_dispatch:
  schedule:
    # Drive does not emit GitHub Actions events. Poll for added or updated files.
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-drive-pdfs
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API client
        run: python -m pip install --upgrade google-api-python-client google-auth

      - name: Export Drive documents as PDFs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: 13cYAubJBTUmxaBG4ED8RuQMQvNW9cBHF
        run: python scripts/export_drive_pdfs.py

      - name: Commit changed PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/documents
          if git diff --cached --quiet; then
            echo "No document changes to commit."
          else
            git commit -m "Sync public Google Drive PDFs"
            git push
          fi
